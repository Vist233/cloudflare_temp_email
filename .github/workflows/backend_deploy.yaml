name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        working-directory: frontend
        run: pnpm run build:worker

      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Apply optional mail parser integration
        run: |
          if [ -n "${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}" ]; then
            cd worker/
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

      - name: Validate worker
        working-directory: worker
        run: pnpm run lint

      - name: Deploy backend
        working-directory: worker
        run: pnpm run deploy -- --message "github-actions $GITHUB_SHA"

      - name: Smoke test production health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://tmpmail.zhangyvjing.com/health_check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
